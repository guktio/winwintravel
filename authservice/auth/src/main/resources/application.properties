spring.application.name=auth

# PostgreSQL Configuration (Docker & Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:${POSTGRES_URL:jdbc:postgresql://localhost:5432/winwindb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret-key=${JWT_SECRET:${JWT_SECRET_KEY:my-default-secret-key-that-is-long-enough-32-bytes}}

# Transform Service (Data API) Configuration
transform.service.url=${TRANSFORM_SERVICE_URL:http://localhost:8081}
internal.token=${INTERNAL_TOKEN:my-secret-internal-token}